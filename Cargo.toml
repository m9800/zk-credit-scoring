[package]
name = "credit-zk"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "credit-zk"
path = "zk/main.rs"

[[bin]]
name = "zkml-estimate"
path = "zk/estimate.rs"

[[bench]]
name = "calibrate_fft"
harness = false
path = "zk/benches/fft.rs"

[[bench]]
name = "calibrate_msm"
harness = false
path = "zk/benches/msm.rs"

[[bench]]
name = "calibrate_add"
harness = false
path = "zk/benches/add.rs"

[[bench]]
name = "calibrate_mul"
harness = false
path = "zk/benches/mul.rs"

[[bench]]
name = "calibrate_permute"
harness = false
path = "zk/benches/permute.rs"

[dependencies]
zkml = { path = "vendor/zkml" }
halo2_proofs = { path = "vendor/zkml/halo2/halo2_proofs", features = ["circuit-params"] }
rand = "0.8.5"
serde_json = "1.0"
libc = "0.2"
rayon = "1.5.1"
rmp-serde = "1.1.1"

[dev-dependencies]
criterion = "0.5.1"
rand_core = "0.6.4"
group = "0.13.0"
ff = "0.13.0"
